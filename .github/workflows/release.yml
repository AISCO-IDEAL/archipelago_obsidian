# Push a tag named like the version (0.3.0): builds the plugin and makes a draft release with main.js, manifest.json and
# styles.css, as Obsidian's community plugin list expects.
name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node build.js
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" dist/main.js dist/manifest.json dist/styles.css
